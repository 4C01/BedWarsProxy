name: Deploy with Maven

on:
  push:
    branches: [production]

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://repo.andrei1058.dev
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17.0.2
        uses: actions/setup-java@v2
        with:
          java-version: '17.0.2'
          distribution: 'adopt'
      - name: Deploy with Maven
        run: |
          export UPDATE_VERSION=$(cat version.txt)
          mvn versions:set -DnewVersion=$UPDATE_VERSION
          mvn versions:update-child-modules
          mvn clean deploy -s ci_settings.xml
          mvn javadoc:javadoc
      - name: Upload JAR to FTP
        uses: modern-dev/ftp-mirror@v2
        with:
          exclude: classes generated-sources maven-archiver maven-status
          server: ${{ secrets.FTP_SERVER }}
          user: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local_dir: proxy-plugin/target
          remote_dir: 4C01/BedwarsProxy
      - name: Create Tag
        uses: softprops/action-gh-release@v1
        with:
          files: proxy-plugin/target/proxy-plugin-${{env.UPDATE_VERSION}}.jar
          generate_release_notes: true
          name: ${{env.UPDATE_VERSION}}
          tag_name: ${{env.UPDATE_VERSION}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}